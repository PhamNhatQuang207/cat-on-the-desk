name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, but only queue one
# more behind it — intermediate commits do not each need their own deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on the same checks used locally, so a broken build or a
      # failing test never reaches the published site.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Pages is enabled on the repo with build_type "workflow". This action
      # cannot turn it on itself — the default GITHUB_TOKEN is not allowed to
      # create a Pages site — so it is enabled once in repo settings instead.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
